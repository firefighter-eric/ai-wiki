name: Wiki CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tooling dependencies
        run: python -m pip install .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate wiki structure
        run: python scripts/lint_wiki.py --no-warnings
      - name: Scan tracked text for credentials
        run: python scripts/scan_secrets.py
      - name: Check migrations are idempotent
        run: |
          python scripts/migrate_wiki_metadata.py
          python scripts/normalize_raw_text_metadata.py
          python scripts/repair_index_descriptions.py
